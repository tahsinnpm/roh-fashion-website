<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Affiliate Orders - Clean Dashboard</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        />
        <style>
            /* ...existing code from update-profile.html... */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Inter", -apple-system, BlinkMacSystemFont,
                    sans-serif;
                background: #f4f6fb;
                min-height: 100vh;
                color: #222;
            }
            .sidebar {
                background: #fff;
                border-radius: 18px;
                box-shadow: 0 2px 16px rgba(44, 62, 80, 0.06);
                padding: 1.5rem 1rem;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .sidebar-item {
                display: flex;
                align-items: center;
                gap: 0.8rem;
                padding: 0.8rem 1.2rem;
                border-radius: 10px;
                color: #6c757d;
                background: none;
                border: none;
                font-weight: 500;
                font-size: 1rem;
                transition: background 0.2s, color 0.2s;
                text-decoration: none;
                width: 100%;
            }
            .sidebar-item.active,
            .sidebar-item:hover {
                background: #ffe6e1;
                color: #dc452c;
            }
            .sidebar-item i {
                font-size: 1.2rem;
            }
            .logout-item {
                color: #e74c3c !important;
            }
            .logout-item:hover {
                background: #e74c3c !important;
                color: #fff !important;
            }
            .form-card {
                background: #fff;
                border-radius: 18px;
                box-shadow: 0 2px 16px rgba(44, 62, 80, 0.07);
                padding: 2rem 2rem 1.5rem 2rem;
            }
            .orders-title {
                font-size: 2rem;
                font-weight: 700;
                color: #dc452c;
                margin-bottom: 1.5rem;
                text-align: center;
            }
            /* New styles for order cards */
            .orders-list {
                display: flex;
                flex-direction: column;
                gap: 1.2rem;
            }
            .order-card {
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 2px 10px rgba(44, 62, 80, 0.07);
                padding: 1.5rem 1.2rem;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 1.2rem;
            }
            .order-info {
                display: flex;
                flex-direction: column;
                gap: 0.2rem;
            }
            .order-id-date {
                font-size: 1.05rem;
                color: #888;
            }
            .order-product {
                font-size: 1.2rem;
                font-weight: 600;
                color: #222;
            }
            .order-amount {
                font-size: 1.1rem;
                color: #dc452c;
                font-weight: 600;
            }
            .order-actions {
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            /* Details button design */
            .btn-details {
                background: #dc452c;
                color: #fff;
                border: none;
                border-radius: 8px;
                padding: 0.45rem 1.2rem;
                font-size: 1rem;
                font-weight: 500;
                transition: background 0.18s, color 0.18s, box-shadow 0.18s;
                box-shadow: 0 1px 4px rgba(220, 69, 44, 0.08);
                outline: none;
            }
            .btn-details:hover,
            .btn-details:focus {
                background: #b33622;
                color: #fff;
                box-shadow: 0 2px 8px rgba(220, 69, 44, 0.13);
                text-decoration: none;
            }
            @media (max-width: 991.98px) {
                .container-wrapper {
                    margin: 1rem;
                }
                .form-card {
                    padding: 1.2rem;
                }
                .orders-title {
                    font-size: 1.3rem;
                }
                .sidebar {
                    padding: 1rem 0.5rem;
                }
            }
            @media (max-width: 576px) {
                .form-card {
                    padding: 0.7rem;
                }
                .orders-title {
                    font-size: 1rem;
                }
                .order-card {
                    flex-direction: column;
                    align-items: flex-start;
                    padding: 1rem 0.7rem;
                }
                .order-actions {
                    width: 100%;
                    justify-content: flex-start;
                }
            }
            .mobile-header {
                display: none;
            }
            @media (max-width: 991.98px) {
                .mobile-header {
                    display: block;
                    background: #fff;
                    border-radius: 12px;
                    padding: 0.7rem 1rem;
                    margin-bottom: 1rem;
                    box-shadow: 0 2px 8px rgba(44, 62, 80, 0.06);
                }
                .mobile-toggle {
                    background: #dc452c;
                    border: none;
                    color: #fff;
                    border-radius: 10px;
                    padding: 0.6rem 1.2rem;
                    font-weight: 500;
                    width: 100%;
                }
                .mobile-toggle:hover {
                    background: #b33622;
                }
                .sidebar {
                    flex-direction: row;
                    justify-content: space-around;
                    align-items: center;
                    gap: 0;
                }
                .sidebar-item span {
                    display: none;
                }
                .sidebar-item i {
                    font-size: 1.5rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="container-fluid py-4">
                <div class="row g-4">
                    <!-- Sidebar -->
                    <div class="col-lg-3">
                        <div class="mobile-header d-lg-none">
                            <button
                                id="sidebarToggleBtn"
                                class="mobile-toggle"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#affiliateSidebar"
                                aria-expanded="false"
                                aria-controls="affiliateSidebar"
                            >
                                <i class="bi bi-grid-3x3"></i> Menu
                            </button>
                        </div>
                        <div class="collapse d-lg-block" id="affiliateSidebar">
                            <div class="sidebar">
                                <a href="#" class="sidebar-item">
                                    <i class="bi bi-speedometer2"></i>
                                    <span>Dashboard</span>
                                </a>
                                <a href="profile.html" class="sidebar-item">
                                    <i class="bi bi-person-circle"></i>
                                    <span>Profile</span>
                                </a>
                                <a
                                    href="orders.html"
                                    class="sidebar-item active"
                                >
                                    <i class="bi bi-cart3"></i>
                                    <span>Orders</span>
                                </a>
                                <a href="#" class="sidebar-item logout-item">
                                    <i class="bi bi-box-arrow-right"></i>
                                    <span>Logout</span>
                                </a>
                            </div>
                        </div>
                    </div>
                    <!-- Main Content -->
                    <div class="col-lg-9">
                        <div class="form-card">
                            <div class="orders-title">
                                <i class="bi bi-cart3 me-2"></i>My Orders
                            </div>
                            <!-- New card-based orders list -->
                            <div class="orders-list">
                                <div class="order-card">
                                    <div class="order-info">
                                        <div class="order-id-date">
                                            #1001 &middot; 2024-06-01
                                        </div>
                                        <div class="order-product">
                                            Product A
                                        </div>
                                    </div>
                                    <div class="order-amount">$120.00</div>
                                    <div class="order-actions">
                                        <span class="badge-status badge-pending"
                                            >Pending</span
                                        >
                                        <button class="btn-details">
                                            Details
                                        </button>
                                    </div>
                                </div>
                                <div class="order-card">
                                    <div class="order-info">
                                        <div class="order-id-date">
                                            #1002 &middot; 2024-05-28
                                        </div>
                                        <div class="order-product">
                                            Product B
                                        </div>
                                    </div>
                                    <div class="order-amount">$75.00</div>
                                    <div class="order-actions">
                                        <span
                                            class="badge-status badge-completed"
                                            >Completed</span
                                        >
                                        <button class="btn-details">
                                            Details
                                        </button>
                                    </div>
                                </div>
                                <div class="order-card">
                                    <div class="order-info">
                                        <div class="order-id-date">
                                            #1003 &middot; 2024-05-20
                                        </div>
                                        <div class="order-product">
                                            Product C
                                        </div>
                                    </div>
                                    <div class="order-amount">$210.00</div>
                                    <div class="order-actions">
                                        <span
                                            class="badge-status badge-cancelled"
                                            >Cancelled</span
                                        >
                                        <button class="btn-details">
                                            Details
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- End Main Content -->
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
